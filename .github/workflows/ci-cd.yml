name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./aet-ski
        
        
      - name: Run linting
        run: npm run lint
        working-directory: ./aet-ski
        
      - name: Run unit tests
        run: npm run test:ci
        working-directory: ./aet-ski
        
      - name: Run performance tests
        run: npm run test:performance
        working-directory: ./aet-ski
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./aet-ski/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./aet-ski
        
        
      - name: Build application
        run: npm run build
        working-directory: ./aet-ski
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          
      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
        working-directory: ./aet-ski
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          
      - name: Setup rollback plan
        run: npm run rollback:setup
        working-directory: ./aet-ski
          
      - name: Deploy to Ionos (Primary)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          password: ${{ secrets.IONOS_PASS }}
          local-dir: ./aet-ski/.next/
          server-dir: /var/www/aet-ski/current/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/cache/**
            
      - name: Deploy to Fasthosts (Secondary)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FASTHOSTS_HOST }}
          username: ${{ secrets.FASTHOSTS_USER }}
          password: ${{ secrets.FASTHOSTS_PASS }}
          local-dir: ./aet-ski/.next/
          server-dir: /var/www/aet-ski/current/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/cache/**
            
      - name: Health check
        run: |
          echo "Performing health check..."
          curl --fail --max-time 10 https://www.aet.ski/healthz || exit 1
          echo "Health check passed!"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'

      - name: Install dependencies (for accurate security graph)
        run: npm ci
        working-directory: ./aet-ski

      - name: Run security audit (prod/high)
        run: npm audit --omit=dev --audit-level=high
        working-directory: ./aet-ski
        
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=aet-ski/package.json --severity-threshold=high 
